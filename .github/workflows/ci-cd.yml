name: SkillMatch AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Run Django Backend Tests & System Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django System Checks
        run: |
          cd backend
          python manage.py check

      - name: Run Django Unit Tests
        run: |
          cd backend
          python manage.py test apps/accounts/tests apps/jobs/tests

  frontend-build:
    name: Build React 19 Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Vite Production Bundle
        run: |
          cd frontend
          npm run build

  deploy-notification:
    name: Deployment Trigger Notification
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Output Deployment Status
        run: |
          echo "CI/CD Pipeline succeeded cleanly! Automatic deployment triggered for Render (Backend API), Vercel (Frontend UI), and Neon (PostgreSQL)."
